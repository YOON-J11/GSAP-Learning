<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02. 타이핑 효과</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
        }

        .typing-wrap {
            font-size: 40px;
            color: white;
        }

        .cursor {
            display: inline-block;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="typing-wrap">
        <span id="typing"></span><span class="cursor">|</span>
    </div>

    <script src="./gsap.min.js"></script>
    <script src="./TextPlugin.min.js"></script>
    <script src="./script.js"></script>
</body>

</html>

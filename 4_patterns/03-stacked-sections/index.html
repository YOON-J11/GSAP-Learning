<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>섹션 덮어쓰기 효과</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: sans-serif;
            overflow-x: hidden;
        }

        /* 1. 컨테이너는 화면 딱 한 장 크기로 설정 */
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* 2. 모든 섹션을 겹쳐서 배치 */
        section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
        }

        /* 쌓임 순서 설정 */
        .section1 {
            background: #2b2b2b;
            z-index: 1;
        }

        .section2 {
            background: #4a6fa5;
            z-index: 2;
            transform: translateY(100%); /* 처음엔 아래에 숨김 */
        }

        .section3 {
            background: #b5654e;
            z-index: 3;
            transform: translateY(100%); /* 처음엔 아래에 숨김 */
        }
    </style>
</head>

<body>

    <div class="container">
        <section class="section1">SECTION 1 (소개)</section>
        <section class="section2">SECTION 2 (커리어)</section>
        <section class="section3">SECTION 3 (연락처)</section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // GSAP 타임라인과 Pin을 이용한 완벽한 순차적 덮어쓰기
        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: ".container",
                start: "top top",   // 트리거요소(.container)의 맨위쪽(top)이 브라우저의 맨위쪽(top)에 닿을때 애니메이션이 시작함
                end: "+=2000",      // 스크롤되는 총 거리 (값이 클수록 전환이 부드럽고 천천히 됨) (2000px이 스크롤되는동안 애니메이션이 일어나게된다.)
                pin: true,          // 애니메이션 동안 화면 고정
                scrub: true,           // scrub:true를 쓰면 애니메이션이 혼자 재생되는 게 금지된다. (사용자가 스크롤 하는 만큼 애니메이션이 재생됨) 숫자를 쓰면 약간의지연시간(부드러운 관성)을 부여한다. ex) scrub: 1, scrub: 0.5
                markers: true,      // 테스트용 마커 (완성 후 삭제)
            }
        });

        // 1단계: 섹션 2가 올라와서 섹션 1을 덮음
        tl.to(".section2", { y: "0%", ease: "none", duration: 1 })
          // 2단계: 섹션 3이 올라와서 섹션 2를 덮음
          .to(".section3", { y: "0%", ease: "none", duration: 1 });
          //duration값은 여기서 초(s)가 아니다.(scrub을 썼기 때문에.)
          // 둘 다 똑같이 1로 설정되어 있기 때문에, 
          // 전체 2000px의 스크롤 구간 중 정확히 절반(1000px)은 섹션 2가 올라오는 데 쓰고, 
          // 나머지 절반(1000px)은 섹션 3이 올라오는 데 쓰게된다.
    </script>
</body>

</html>

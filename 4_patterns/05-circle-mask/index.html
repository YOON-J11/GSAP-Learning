<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05. 원형 마스크 확장</title>
    <style>
        body {
            margin: 0;
        }

        section {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 40px;
        }
        .hero-wrap {
            position: relative;
            height: 100vh;
        }

        .section1 {
            background: #2b2b2b;
        }

        .section2 { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #b5654e;
            clip-path: circle(0% at center);/*처음엔 clip-path로 거의 안 보이게(원 크기 0) 가려둠.*/
        }

        .spacer {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <div class="hero-wrap">
        <section class="section1">SECTION 1</section>
        <section class="section2">SECTION 2</section>
    </div>

    <section class="spacer">SECTION 3</section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
        gsap.registerPlugin(ScrollTrigger);

        gsap.to(".section2",{
            clipPath: "circle(150% at center)",
            ease: "none",
            scrollTrigger: {
                trigger: ".hero-wrap", //.hero-wrap을 기준으로 스크롤감지
                start: "top top", //.hero-wrap의 top이 화면 맨 위에 닿으면 시작
                end: "+=1000", // 1000px 스크롤하면 끝
                pin: true, // 이 구간동안은 화면을 고정
                scrub: true, // 스크롤과 애니메이션 동기화
                markers: true, // 스크롤 마크 표시
            }
        })
    </script>
</body>

</html>

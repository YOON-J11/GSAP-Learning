<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05-2. 창이 열리는 효과</title>
    <style>
        body {
            margin: 0;
        }

        section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 40px;
        }
        .hero-wrap {
            position: relative;
            height: 100vh;
        }

        .section1 {
            background: #2b2b2b;
        }

        .section2 { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #b5654e;
            clip-path: polygon(50% 0%, 50% 0%, 50% 100%, 50% 100%);
        }
            /*
            clip-path: polygon는 이렇게 생김
            (첫번째값은 x축, 두번째값은 y축)
            
            점1(0%, 0%)  ------------------ 점2(100%, 0%)
                |                             |
                |           화면 영역           |
                |                             |
            점4(0%, 100%) ----------------- 점3(100%, 100%)

            polygon(점1, 점2, 점3, 점4) 형태로 점을 이어 그린다고 생각하면 됨


            [가운데 20%x20% 크기의 정사각형 마스크]
            clip-path: polygon(40% 40%, 60% 40%, 60% 60%, 40% 60%);
            근데, 정사각형을 쓰려면 굳이 polygon을 쓸 필요가 없이
            clip-path: inset(40%); 를 쓰면 된다.




            ■ inset(0%) - 잘라내는 여백 0% (전체 화면)
            ┌──────────────────┐
            │                  │  <- 바깥 테두리에서 하나도 안 파고듦
            │    전체 보임       │
            │                  │
            └──────────────────┘

            ■ inset(25%) - 상우하좌 25%씩 파고듦 (중앙 50% 크기 창)
            ┌──────────────────┐
            │  여백   25%       │
            │     ┌──────┐     │
            │ 25% │ 보임  │ 25% │
            │     └──────┘     │
            │         25%      │
            └──────────────────┘

            ■ inset(50%) - 상우하좌 50%씩 파고듦 (중앙에서 접힘)
            ┌─────────┬────────┐
            │  여백    │  여백   │
            ├─────────┼────────┤ <- 상/하, 좌/우 여백이 50% 지점에서 서로 만나서
            │  여백    │  여백   │    보이는 영역의 크기가 0이 됨
            └─────────┴────────┘

            */
        .spacer {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <div class="hero-wrap">
        <section class="section1">SECTION 1</section>
        <section class="section2">SECTION 2</section>
    </div>

    <section class="spacer">SECTION 3</section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
gsap.registerPlugin(ScrollTrigger);

// 1. 타임라인 생성 및 ScrollTrigger 설정
const tl = gsap.timeline({
    scrollTrigger: {
        trigger: ".hero-wrap",
        start: "top top",
        end: "+=1200", // 전체 스크롤 길이를 2000px로 확대 (애니메이션 1000px + 유지 1000px)
        pin: true,
        scrub: true,
        markers: true,
    }
});

// 2. 창이 열리는 애니메이션 (전체 진행도의 절반 동안 실행)
tl.to(".section2", {
    clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
    ease: "none",
    duration: 1000
})
// 3. 열린 상태로 일정 스크롤 동안 멈춰있는 홀드(Hold) 구간 추가
.to({}, { duration: 200 }); // 빈 애니메이션으로 대기 시간 확보
    </script>
</body>

</html>

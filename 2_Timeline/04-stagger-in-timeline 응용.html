<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03. Timeline 안에 stagger</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f4f1ec;
            gap: 30px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            opacity: 0;
            transform: translateY(-20px);
        }

        .menu {
            display: flex;
            gap: 24px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu li {
            font-size: 16px;
            opacity: 0;
        }

        /* 가운데(menu)는 아래에서 위로 */
        .menu li.center {
            transform: translateY(20px);
        }

        /* 나머지는 처음엔 가운데(x:0)에 몰려있다가 양옆으로 퍼짐 */
        .menu li:not(.center) {
            transform: translateX(0);
        }
    </style>
</head>

<body>


    <div class="logo">LOGO</div>
    <ul class="menu">
        <li class="side">HOME</li>
        <li class="side">ABOUT</li>
        <li class="center">MENU</li>
        <li class="side">WORK</li>
        <li class="side">CONTACT</li>
    </ul>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script>

        const tl = gsap.timeline();

        tl.to(".logo", { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" })
            .to(".menu li.center", { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", }, "-=0.2") //가운데 메뉴만 아래에서 위로
            .fromTo(".menu li.side", { x: 0 }, // 시작: li모두 가운데 위치(x:0)에서 시작한다
                {
                    opacity: 1,

                    // 함수형 속성값 (x: (index, target))
                    // gsap에 내장된 기능으로, 매개변수 index에는 순서번호, target에는 현재 애니메이션이 적용되고 있는 특정 HTML DOM 요소가 온다
                    x: (index, target) => { //끝점 : 각자 계산된 위치 (x값)로 이동함 // HOME, ABOUT은 왼쪽으로, WORK, CONTACT는 오른쪽으로
                        const items = gsap.utils.toArray(".menu li.side");
                        const center = (items.length - 1) / 2; //정중앙인 인덱스 번호를 구함. 여기서 정중앙은 1과 2 사이라 1.5 (인덱스는 0부터시작해서 1을 뺀다.)
                        return (index - center) * 40; // 중심에서 얼마나 떨어졌는지에 비례해 이동
                        //첫번째 li(HOME)는 index: 0. (0 - 1.5) * 40 = -60, 즉 x축으로 -60이동(왼쪽으로 60px이동)
                        //두번째 li(ABOUT)은 -20, 세번째 20, 네번째 60 값이 들어간다.
                    },
                    duration: 0.6,
                    ease: "power2.out",
                    stagger: {
                        each: 0.02,
                        from: "center", // 가운데(ABOUT/WORK)부터 시작해서 바깥으로 퍼짐
                    },
                })

    </script>
</body>

</html>

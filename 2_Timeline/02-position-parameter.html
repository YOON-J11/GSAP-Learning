<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02. 포지션 파라미터</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f4f1ec;
            gap: 16px;
        }

        .title,
        .subtitle,
        .cta {
            opacity: 0;
            transform: translateY(30px);
        }

        .title {
            font-size: 40px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
        }

        .cta {
            margin-top: 20px;
            padding: 14px 32px;
            background: #3a7d44;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1 class="title">HELLO, GSAP</h1>
    <p class="subtitle">타임라인으로 순서를 조율해봅시다</p>
    <button class="cta">시작하기</button>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script>

        const t1 = gsap.timeline();

        t1.to(".title", { opacity: 1, y: 1, duration: 1, ease: "power2.out" })
            .to(".subtitle", { opacity: 1, y: 0, ease: "power2.out" }, "-=0.6")  //이전 애니메이션이 끝나기 0.6초 전에 시작 (이전 애니메이션이랑 겹침)
            .to(".cta", { opacity: 1, y: 1, duration: 1, ease: "power2.out" }, "<0.6") //이전 애니메이션이 끝나고 나서 0.6초 쉰 후 시작

            // "-=0.6"  이전 애니메이션이 끝나기 0.6초 전에 시작
            // "+=0.6"  이전 애니메이션이 끝난 후 0.6초 쉬고 시작
            // "<"      이전 애니메이션과 동시에 시작
            // "<0.2"   이전 애니메이션이 시작한 시점 시준 0.6초 후

    </script>
</body>

</html>

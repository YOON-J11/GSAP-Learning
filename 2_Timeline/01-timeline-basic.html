<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01. Timeline 기본</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f4f1ec;
            gap: 16px;
        }

        .title {
            font-size: 40px;
            font-weight: 800;
            opacity: 0;
            transform: translateY(30px);
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            opacity: 0;
            transform: translateY(30px);
        }

        .cta {
            margin-top: 20px;
            padding: 14px 32px;
            background: #3a7d44;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(30px);
        }
    </style>
</head>

<body>

    <h1 class="title">HELLO, GSAP</h1>
    <p class="subtitle">타임라인으로 순서를 조율해봅시다</p>
    <button class="cta">시작하기</button>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script>

        const tl = gsap.timeline(); // 빈 타임라인 생성

        tl.to(".title", { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }) // 1번째 애니메이션
            .to(".subtitle", { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }) // 2번째 애니메이션 (1번 끝나면 자동 시작)
            .to(".cta", { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }); // 3번째 애니메이션 (2번 끝나면 자동 시작)

    </script>
</body>

</html>

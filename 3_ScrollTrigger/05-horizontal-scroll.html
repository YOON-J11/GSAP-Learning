<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05. 가로 스크롤</title>
    <style>
        body {
            margin: 0;
            background: #f4f1ec;
            font-family: sans-serif;
        }

        .spacer {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
        }

        .horizontal-section {
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .track {
            display: flex;
            height: 100%;
            width: max-content;/* 카드 개수만큼 가로로 늘어남 */
        }

        .card {
            width: 1000px;
            height: 100%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: white;
        }

        .card:nth-child(1) {
            background: #3a7d44;
        }

        .card:nth-child(2) {
            background: #e07a5f;
        }

        .card:nth-child(3) {
            background: #4a6fa5;
        }

        .card:nth-child(4) {
            background: #b08968;
        }
    </style>
</head>

<body>
    <section class="spacer">스크롤 해보세요 ↓</section>

    <section class="horizontal-section">
        <div class="track">
            <div class="card">CARD 1</div>
            <div class="card">CARD 2</div>
            <div class="card">CARD 3</div>
            <div class="card">CARD 4</div>
        </div>
    </section>

    <section class="spacer">다음 섹션</section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <script>
        gsap.registerPlugin(ScrollTrigger);

        const track = document.querySelector(".track");

        gsap.to(track, {
            x: () => -(track.scrollWidth - window.innerWidth), // 카드 전체 너비만큼 왼쪽으로 이동
            ease: "none",
            scrollTrigger: {
                trigger: ".horizontal-section",
                start: "top top",
                end: () => "+=" + (track.scrollWidth - window.innerWidth), // 카드 전체 너비만큼 스크롤 구간 확보
                pin: true,
                scrub: true,
                markers: true,
            },
        })

    </script>
</body>

</html>

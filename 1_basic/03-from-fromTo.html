<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03. from / fromTo</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f4f1ec;
            gap: 40px;
        }
    </style>
</head>

<body>

    <h1 class="title">GSAP FROM 연습</h1>
    <h1 class="title2">GSAP FROMTo 연습</h1>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script>

        /*

        메서드        시작점                끝점
        to()        현재상태(자동)          내가 지정한 값
        from()      내가 지정한 값          현재 상태 (자동)
        fromTo()    내가 지정한 값          내가 지정한 값

        */

        //gsap.from() : "이 상태에서 시작해서 원래 자리로"가는 개념이다.
        //gsap.fromTo() : 시작과 끝을 둘 다 직접 지정하다.

        gsap.from(".title", {
            y: 50, // y축으로 50px 올라간채로 시작함
            opacity: 0, // 투명하게 시작함
            duration: 1, // 1초 동안 애니메이션 재생
            ease: "power2.inOut", // 움직임의 느낌(가속/감속 곡선)
        });

        gsap.fromTo(".title2",
            {
                y: 50,
                opacity: 0,
            },
            {
                y: 0,
                opacity: 1,

                //타이밍/제어 옵션은 항상 두 번째(끝 상태) 객체에만 쓴다.
                duration: 2, //애니메이션 시간
                ease: "power2.inOut", //애니메이션 속도 (천천히 출발 → 빨라짐 → 천천히 도착)
                delay: 0.5, //딜레이
            }
        );


    </script>
</body>

</html>

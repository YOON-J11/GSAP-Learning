<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02. gsap.to()</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 100px;
            height: 100vh;
            margin: 0;
            background: #f4f1ec;
        }

        .box {
            width: 100px;
            height: 100px;
            background: #e07a5f;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>박스를 클릭하면 움직입니다.</h1>
    <div class="box"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script>
        // "to"의 의미: '이 값까지 도착하는 애니메이션'이라는 뜻.
        // "box를 현재 위치에서 x: 200인 지점까지, 1초 동안 이동시켜라"
        const box = document.querySelector(".box");
        box.addEventListener("click", () => {
            gsap.to(box, {
                x: 200,
                rotation: 360,
                duration: 1,
            });
        });


        //애니메이션 자체를 제어하는 옵션
        // gsap.to(box, {
        //     x: 200,
        //     duration: 1,     // 몇 초 동안 재생할지
        //     delay: 0.5,       // 몇 초 후에 시작할지
        //     ease: "power2.out", // 움직임의 느낌(가속/감속 곡선)
        //     repeat: 2,         // 반복 횟수 (-1이면 무한반복)
        //     yoyo: true,        // 반복 시 왔다갔다(요요처럼)
        //     onComplete: () => console.log("끝!"), // 끝났을 때 실행할 함수
        // });

        //ease 속성 정리
        // ease: "power1.out"  // 약하게 감속하며 끝남
        // ease: "power2.out"  // 중간 정도로 감속
        // ease: "power4.out"  // 아주 급격하게 감속 (처음엔 확 빠르다가 끝에 확 느려짐)
        // ease: "power2.in"     // 천천히 출발 → 급가속하며 끝남
        // ease: "power2.out"    // 급출발 → 천천히 도착
        // ease: "power2.inOut"  // 천천히 출발 → 빨라짐 → 천천히 도착
        // ease: "none"          // 등속. 가감속 없이 일정한 속도 (linear라고도 함)
        // ease: "back.out(1.7)" // 목표 지점을 살짝 지나쳤다가 돌아옴 (통통 튀는 느낌)
        // ease: "elastic.out(1, 0.3)" // 고무줄처럼 몇 번 진동하며 안착
        // ease: "bounce.out"    // 바닥에 튕기듯 통통 튀며 멈춤 (공 떨어지는 느낌)
    </script>
</body>

</html>
